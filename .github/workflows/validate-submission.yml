name: Validate submission

on:
  pull_request:
    paths:
      - "submissions/**"
  push:
    branches: [main]
    paths:
      - "submissions/**"

permissions:
  contents: read

jobs:
  # Gate 1: SHACL validation against the shapes of the URPX version each
  # submission declares, not against whatever is current. Add this job as a
  # required status check on main once the repository exists; no named
  # reviewer or review-required branch protection is added alongside it
  # (Meeting #017, automated-only for now).
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate submissions against their declared URPX version
        run: python3 scripts/validate_submission.py submissions/

  # The SPARQL summary queries that log a passing submission to the catalog
  # index. Runs only after a merge to main, never on a pull request, so the
  # index never shares a commit path with a hand-edited file.
  catalog:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalog dependencies
        run: pip install rdflib

      - name: Regenerate the catalog index
        run: python3 scripts/update_catalog_index.py submissions/ catalog/submissions-index.csv

      - name: Commit the catalog index if it changed
        run: |
          if git diff --quiet -- catalog/submissions-index.csv; then
            echo "Catalog index unchanged."
            exit 0
          fi
          git config user.name "urpx-sandbox-bot"
          git config user.email "urpx-sandbox-bot@users.noreply.github.com"
          git add catalog/submissions-index.csv
          git commit -m "chore: refresh the submissions catalog index"
          git push
